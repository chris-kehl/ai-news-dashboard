<!DOCTYPE html>
<html><body>
<div id="sticky-cnbc"></div>
<div id="sticky-yahoo"></div>
<div id="sticky-bloomberg"></div>
<div id="sticky-wsb"></div>
<script>
var $=function(id){return document.getElementById(id)};
function makeItemHTML(n){return '<div><a href="'+n.url+'">'+n.title+'</a></div>';}

var testData={
  sticky:{
    cnbc:[{title:"Test CNBC",url:"#",source:"CNBC",published:"2026-07-24"}],
    yahoo_finance:[{title:"Test Yahoo",url:"#",source:"Yahoo",published:"2026-07-24"}],
    bloomberg:[],
    wallstreetbets:[{title:"Test WSB",url:"#",score:42}]
  }
};

var sticky=testData.sticky;
var scn=sticky.cnbc||[],syf=sticky.yahoo_finance||[],sbl=sticky.bloomberg||[],swb=sticky.wallstreetbets||[];
$('sticky-cnbc').innerHTML=scn.map(makeItemHTML).join('')||'<div>NO CNBC</div>';
$('sticky-yahoo').innerHTML=syf.map(makeItemHTML).join('')||'<div>NO YAHOO</div>';
$('sticky-bloomberg').innerHTML=sbl.map(makeItemHTML).join('')||'<div>NO BLOOMBERG</div>';
$('sticky-wsb').innerHTML=swb.map(function(p){return'<div><a href="'+p.url+'">'+p.title+'</a></div>';}).join('')||'<div>NO WSB</div>';
</script>
</body></html>
